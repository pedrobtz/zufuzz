# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # No fuzzing engine is installed on any of these runners, and that is
      # deliberate: it is the configuration CRAN checks in, and the package
      # must install, load and pass with nothing else present. Engine
      # dependent tests skip themselves via engine_available().
      #
      # The architectural gate is tests/testthat/test-symbols.R, which scans
      # the built shared object and fails the suite if it can end the R
      # process, signal it, write to its streams, or reference an engine or
      # sanitizer symbol. That is enforced here, since a failing test fails
      # the check.
      #
      # error-on is "warning" rather than "note" because one NOTE is
      # inherent: `unlockBinding` in R/instrument.R, which is how an
      # instrumented body is put back into a locked namespace. See
      # cran-comments.md. Gating on zero NOTEs would mean either hiding that
      # call from the reviewer or never adding an expected note again, and
      # the symbol scan is the more precise gate anyway.
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
