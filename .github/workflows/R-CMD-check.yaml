# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # zufuzz depends on nothing from Bioconductor -- every dependency is
      # CRAN or base -- but `R CMD check` consults every configured repository
      # when it checks for unstated dependencies. A Bioconductor outage then
      # surfaces as `checking for unstated dependencies ... WARNING` and,
      # under error-on "warning", reddens a build that is otherwise perfect.
      # That happened three times in half an hour.
      #
      # The lever is R_REPOSITORIES, not options(repos). The first attempt
      # here appended options(repos=) to Rprofile.site and asserted that a
      # fresh Rscript saw it. That assertion passed and the build still went
      # red: check's dependency step runs under --vanilla, which skips site
      # profiles entirely and falls back to the repositories *file* that this
      # variable names. The assertion was testing a process that was not the
      # one doing the work.
      #
      # tools:::.get_standard_repository_URLs() uses getOption("repos") only
      # when CRAN, BioCsoft, BioCann and BioCexp are all present and CRAN is
      # not "@CRAN@"; otherwise it reads that file. Giving all four names a
      # CRAN URL satisfies it without ever resolving a Bioconductor host, and
      # without leaving an NA that available.packages() would then fail on.
      - name: Point every repository at CRAN, and prove check sees it
        shell: Rscript {0}
        run: |
          cran <- "https://cloud.r-project.org"
          path <- file.path(
            Sys.getenv("RUNNER_TEMP", unset = tempdir()), "cran-only-repositories"
          )
          row <- function(name, default) {
            paste(name, name, cran, default, "TRUE", "TRUE", "TRUE", sep = "\t")
          }
          writeLines(
            c(
              paste("menu_name", "URL", "default", "source",
                    "win.binary", "mac.binary", sep = "\t"),
              row("CRAN", "TRUE"),
              row("BioCsoft", "FALSE"),
              row("BioCann", "FALSE"),
              row("BioCexp", "FALSE")
            ),
            path
          )
          # Every later step, check included, inherits this.
          cat(sprintf("R_REPOSITORIES=%s\n", path),
              file = Sys.getenv("GITHUB_ENV"), append = TRUE)

          # Assert against the function R CMD check actually calls, in a
          # --vanilla child: the configuration that defeated the last attempt.
          # Sys.setenv rather than system2(env=) because the child inherits it
          # on every platform, including the Windows runner.
          Sys.setenv(R_REPOSITORIES = path)
          probe <- file.path(tempdir(), "zufuzz-repo-probe.R")
          writeLines(
            'cat(tools:::.get_standard_repository_URLs(), sep = "\n")', probe
          )
          seen <- system2(
            file.path(R.home("bin"), "Rscript"),
            c("--vanilla", shQuote(probe)),
            stdout = TRUE
          )
          cat("R CMD check will consult:\n"); cat(seen, sep = "\n"); cat("\n")
          if (any(grepl("bioconductor", seen, ignore.case = TRUE))) {
            stop("the override did not take effect: Bioconductor is still listed")
          }
          if (!length(seen) || anyNA(seen) || any(seen == "NA")) {
            stop("a repository resolved to NA, which available.packages() fails on")
          }

      # No fuzzing engine is installed on any of these runners, and that is
      # deliberate: it is the configuration CRAN checks in, and the package
      # must install, load and pass with nothing else present. Engine
      # dependent tests skip themselves via engine_available().
      #
      # The architectural gate is tests/testthat/test-symbols.R, which scans
      # the built shared object and fails the suite if it can end the R
      # process, signal it, write to its streams, or reference an engine or
      # sanitizer symbol. That is enforced here, since a failing test fails
      # the check.
      #
      # error-on is "warning" rather than "note" because one NOTE is
      # inherent: `unlockBinding` in R/instrument.R, which is how an
      # instrumented body is put back into a locked namespace. See
      # cran-comments.md. Gating on zero NOTEs would mean either hiding that
      # call from the reviewer or never adding an expected note again, and
      # the symbol scan is the more precise gate anyway.
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # The only job with a real fuzzing engine. Everything AFL-specific is
  # skip_if_not(engine_available("afl")) elsewhere, so this is where those
  # tests actually execute -- the protocol cannot be verified without a
  # supervisor that speaks it.
  afl-engine:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, afl++)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # AFL refuses to start on a machine whose cpufreq governor it cannot
      # check; on a CI runner there is nothing to tune.
      AFL_SKIP_CPUFREQ: 1

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # zufuzz depends on nothing from Bioconductor -- every dependency is
      # CRAN or base -- but `R CMD check` consults every configured repository
      # when it checks for unstated dependencies. A Bioconductor outage then
      # surfaces as `checking for unstated dependencies ... WARNING` and,
      # under error-on "warning", reddens a build that is otherwise perfect.
      # That happened three times in half an hour.
      #
      # The lever is R_REPOSITORIES, not options(repos). The first attempt
      # here appended options(repos=) to Rprofile.site and asserted that a
      # fresh Rscript saw it. That assertion passed and the build still went
      # red: check's dependency step runs under --vanilla, which skips site
      # profiles entirely and falls back to the repositories *file* that this
      # variable names. The assertion was testing a process that was not the
      # one doing the work.
      #
      # tools:::.get_standard_repository_URLs() uses getOption("repos") only
      # when CRAN, BioCsoft, BioCann and BioCexp are all present and CRAN is
      # not "@CRAN@"; otherwise it reads that file. Giving all four names a
      # CRAN URL satisfies it without ever resolving a Bioconductor host, and
      # without leaving an NA that available.packages() would then fail on.
      - name: Point every repository at CRAN, and prove check sees it
        shell: Rscript {0}
        run: |
          cran <- "https://cloud.r-project.org"
          path <- file.path(
            Sys.getenv("RUNNER_TEMP", unset = tempdir()), "cran-only-repositories"
          )
          row <- function(name, default) {
            paste(name, name, cran, default, "TRUE", "TRUE", "TRUE", sep = "\t")
          }
          writeLines(
            c(
              paste("menu_name", "URL", "default", "source",
                    "win.binary", "mac.binary", sep = "\t"),
              row("CRAN", "TRUE"),
              row("BioCsoft", "FALSE"),
              row("BioCann", "FALSE"),
              row("BioCexp", "FALSE")
            ),
            path
          )
          # Every later step, check included, inherits this.
          cat(sprintf("R_REPOSITORIES=%s\n", path),
              file = Sys.getenv("GITHUB_ENV"), append = TRUE)

          # Assert against the function R CMD check actually calls, in a
          # --vanilla child: the configuration that defeated the last attempt.
          # Sys.setenv rather than system2(env=) because the child inherits it
          # on every platform, including the Windows runner.
          Sys.setenv(R_REPOSITORIES = path)
          probe <- file.path(tempdir(), "zufuzz-repo-probe.R")
          writeLines(
            'cat(tools:::.get_standard_repository_URLs(), sep = "\n")', probe
          )
          seen <- system2(
            file.path(R.home("bin"), "Rscript"),
            c("--vanilla", shQuote(probe)),
            stdout = TRUE
          )
          cat("R CMD check will consult:\n"); cat(seen, sep = "\n"); cat("\n")
          if (any(grepl("bioconductor", seen, ignore.case = TRUE))) {
            stop("the override did not take effect: Bioconductor is still listed")
          }
          if (!length(seen) || anyNA(seen) || any(seen == "NA")) {
            stop("a repository resolved to NA, which available.packages() fails on")
          }

      - name: Install AFL++
        run: |
          sudo apt-get update
          sudo apt-get install -y afl++
          afl-fuzz -h 2>&1 | head -3 || true

      - name: Let AFL see child crashes
        # AFL detects a crash from how the child died. If core_pattern pipes
        # cores to a handler, the signal is consumed before AFL sees it and
        # every finding is silently lost.
        run: echo core | sudo tee /proc/sys/kernel/core_pattern

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
